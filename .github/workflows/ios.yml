name: ios

on:
  push:
    branches: [ios]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirrors upstream's generate-soh-otr job. GenerateSohOtr only packs soh/assets/custom and
  # the engine's shaders (no ROM), so no game content is ever present in CI: soh.o2r contains
  # only the port's own assets.
  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Compute o2r cache key
      id: o2rkey
      run: echo "key=otr-$(git rev-parse HEAD:soh/assets)-$(git rev-parse HEAD:torch)-$(git rev-parse HEAD:libultraship)-$(git rev-parse HEAD:CMakeLists.txt)" >> "$GITHUB_OUTPUT"
    - name: Cache soh.o2r
      id: o2rcache
      uses: actions/cache@v4
      with:
        path: soh.o2r
        key: ${{ steps.o2rkey.outputs.key }}
    - name: Install dependencies
      if: steps.o2rcache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Generate soh.o2r
      if: steps.o2rcache.outputs.cache-hit != 'true'
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-ios:
    needs: generate-soh-otr
    runs-on: macos-26
    env:
      # Pin the toolchain: the image's default Xcode rotates every ~6 weeks. Xcode 26.6
      # carries the iOS 26.5 SDK; deployment target stays 16.0, so nothing about install
      # or device support changes — the app is simply built fully native for iOS 26.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Verify toolchain
      run: |
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version
        test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.5"
        ninja --version
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ios-build-xcode26
        max-size: "1G"
        evict-old-files: job
    - name: Cache codec deps
      id: cache-codec-deps
      uses: actions/cache@v4
      with:
        path: ios-deps-prefix
        key: ${{ runner.os }}-ios-codec-deps-xcode26-${{ hashFiles('.github/scripts/build-ios-deps.sh') }}
    - name: Build codec deps (ogg/vorbis/opus/opusfile/libpng)
      if: steps.cache-codec-deps.outputs.cache-hit != 'true'
      run: bash .github/scripts/build-ios-deps.sh "$PWD/ios-deps-prefix"
    - name: Configure (iphoneos arm64, Metal-only)
      env:
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
          -DPLATFORM=OS64 \
          -DDEPLOYMENT_TARGET=16.0 \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_PREFIX_PATH="$PWD/ios-deps-prefix" \
          -DCMAKE_FIND_ROOT_PATH="$PWD/ios-deps-prefix" \
          -DENABLE_SCRIPTING=OFF \
          -DDISABLE_DLL_LOADER=ON \
          -DBUNDLE_ID=com.patricklm.shipofharkinian
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build
      env:
        CCACHE_SLOPPINESS: pch_defines,time_macros
      run: cmake --build build-cmake --target soh -j3
    - name: Generate app icons
      run: |
        APP=$(find build-cmake -name "*.app" -type d | head -1)
        sips -z 120 120 soh/macosx/sohIcon.png --out "$APP/Icon-60@2x.png" || true
        sips -z 180 180 soh/macosx/sohIcon.png --out "$APP/Icon-60@3x.png" || true
    - name: Stamp SDK metadata in Info.plist
      run: |
        # Bare CMake+Ninja never stamps DT* keys the way xcodebuild would; keep them honest
        # by writing the actual SDK the binary was built against.
        APP=$(find build-cmake -name "*.app" -type d | head -1)
        SDKV=$(xcrun --sdk iphoneos --show-sdk-version)
        plutil -replace DTPlatformVersion -string "$SDKV" "$APP/Info.plist"
        plutil -replace DTSDKName -string "iphoneos$SDKV" "$APP/Info.plist"
    - name: Convert Info.plist to binary (sideload-tool compatibility)
      run: |
        APP=$(find build-cmake -name "*.app" -type d | head -1)
        plutil -convert binary1 "$APP/Info.plist"
        plutil -lint "$APP/Info.plist"
    - name: Package unsigned IPA
      run: |
        APP=$(find build-cmake -name "*.app" -type d | head -1)
        echo "Bundling $APP"
        test -n "$APP"
        mkdir -p Payload
        cp -R "$APP" Payload/
        zip -qry soh-ios.ipa Payload
    - name: Upload IPA
      uses: actions/upload-artifact@v7
      with:
        name: soh-ios-ipa
        path: soh-ios.ipa
        retention-days: 7
